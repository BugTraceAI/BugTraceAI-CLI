services:
  api:
    build: .
    container_name: bugtrace_api
    init: true          # run tini so orphaned chromium procs get reaped (no zombie pile-up)
    shm_size: 2gb       # chromium renderers use /dev/shm; the 64MB default exhausts -> renderer wedge -> hang
    ports:
      - "${CLI_PORT:?CLI_PORT must be set}:${CLI_PORT}"
    command: ["serve", "--host", "0.0.0.0", "--port", "${CLI_PORT}"]
    volumes:
      - cli-scans:/app/scans
      - cli-reports:/app/reports
      - cli-db:/app/data
      - cli-logs:/app/logs   # persist scanner logs (execution.log / bugtrace.jsonl / errors.log) across rebuilds — enables saturation/timeout forensics
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.env:/app/.env   # bind the host .env so Provider-tab key changes (update_env_var writes /app/.env) persist across restarts
    env_file:
      - .env
    environment:
      BUGTRACE_CORS_ORIGINS: ${BUGTRACE_CORS_ORIGINS:-http://localhost:5173,http://localhost:6869}
    networks:
      bugtraceai-platform:
        aliases:
          - bugtrace-cli-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${CLI_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  mcp:
    build: .
    container_name: bugtrace_mcp
    ports:
      - "${MCP_PORT:?MCP_PORT must be set}:${MCP_PORT}"
    command: ["mcp", "--sse", "--host", "0.0.0.0", "--port", "${MCP_PORT}"]
    volumes:
      - cli-reports:/app/reports
      - cli-logs:/app/logs
      - cli-db:/app/data
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    networks:
      - bugtraceai-platform
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -m 2 http://localhost:${MCP_PORT}/sse >/dev/null; res=$$?; [ $$res -eq 0 ] || [ $$res -eq 28 ] || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  cli-scans:
  cli-reports:
  cli-logs:
  cli-db:

networks:
  bugtraceai-platform:
    name: ${BTAI_SHARED_NETWORK:-bugtraceai-platform}
    driver: bridge
